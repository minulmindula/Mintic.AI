[project]
name = "mintic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "minulmindula", email = "minul.mindula72@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.43.5",
    "fastapi>=0.128.8",
    "fastmcp>=2.14.1",
    "google-genai>=2.16.0",
    "langchain-google-genai>=4.3.2",
    "langchain-mcp-adapters>=0.3.1",
    "langgraph>=1.2.10",
    "mcp<2.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.11.0",
    "pytest>=8.4.2",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

