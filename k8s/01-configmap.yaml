apiVersion: v1
kind: ConfigMap
metadata:
  name: mintic-config
  namespace: mintic-ai
data:
  ALPACA_PAPER: "true"
  MAX_POSITION_SIZE_GBP: "10000.0"
  MIN_CONFIDENCE_THRESHOLD: "0.70"
  MAX_DAILY_DRAWDOWN_PERCENT: "5.0"
  DATABASE_URL: "sqlite+aiosqlite:///./mintic_audit.db"
  QDRANT_LOCATION: ":memory:"
  NEXT_PUBLIC_API_URL: "http://api-service.mintic-ai.svc.cluster.local:8000"
