apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: mintic-ai
  labels:
    app: mintic-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mintic-api
  template:
    metadata:
      labels:
        app: mintic-api
    spec:
      containers:
        - name: api
          image: mintic-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: mintic-config
            - secretRef:
                name: mintic-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: mintic-ai
  labels:
    app: mintic-api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: mintic-api
