apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  namespace: mintic-ai
  labels:
    app: mintic-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mintic-web
  template:
    metadata:
      labels:
        app: mintic-web
    spec:
      containers:
        - name: web
          image: mintic-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: mintic-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: mintic-ai
  labels:
    app: mintic-web
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: mintic-web
