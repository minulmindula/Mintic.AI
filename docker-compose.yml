services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: mintic-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      ALPACA_API_KEY: "${ALPACA_API_KEY:-PKTEST_KEY_ID}"
      ALPACA_SECRET_KEY: "${ALPACA_SECRET_KEY:-PKTEST_SECRET_KEY}"
      ALPACA_PAPER: "true"
      DATABASE_URL: "sqlite+aiosqlite:///./mintic_audit.db"
      QDRANT_LOCATION: ":memory:"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: mintic-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    depends_on:
      api:
        condition: service_healthy
